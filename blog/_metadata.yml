# Date format
date-format: "dddd, MMMM D, YYYY"

# Enable banner style title blocks
title-block-banner: "#170C3A"

# HTML options are set at the top level here instead of under `format: html:`
# because any format named in a _metadata.yml file gets added to every
# document in the folder. With `format: html:` here, revealjs slides in a
# post folder would also render as html, and both formats would write to
# the same slides.html.
code-tools: true
comments:
  giscus:
    repo: andrewheiss/ath-quarto
    category: Blog comments
    category-id: DIC_kwDOIg6EJc4CSz92
    mapping: pathname

# Add blog-post class to the banner header area
quarto-template-params:
  banner-header-class: "blog-post"

# Default for table of contents
toc: true
toc-title: Contents
toc-location: left

freeze: true

# Default knitr options
execute:
  echo: true
  message: true
  warning: true

# Default author
author:
  - name: Andrew Heiss
    url: https://www.andrewheiss.com/
    orcid: 0000-0002-3948-3914
